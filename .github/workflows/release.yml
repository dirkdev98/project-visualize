name: Release

# A manual run from main publishes an alpha prerelease, versioned from the build
# month and the run number. Pushing a YYYY.MM.PATCH tag publishes that release.
on:
  workflow_dispatch:
  push:
    tags: ["[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT" = "push" ]; then
            if ! printf '%s' "$REF_NAME" | grep -Eq '^[0-9]{4}\.(0[1-9]|1[0-2])\.[1-9][0-9]*$'; then
              echo "::error::Release tags look like 2026.01.1, got $REF_NAME"
              exit 1
            fi
            version="$REF_NAME"
            prerelease=false
          else
            if [ "$REF" != "refs/heads/main" ]; then
              echo "::error::Alpha builds run from main, got $REF"
              exit 1
            fi
            version="$(date -u +%Y.%m).0-alpha.$RUN_NUMBER"
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Building $version" >> "$GITHUB_STEP_SUMMARY"

  macos:
    needs: version
    runs-on: macos-15
    timeout-minutes: 60
    env:
      VISUALIZE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install native build tools
        run: brew install cmake pkgconf sdl3
      - run: npm ci
      - run: npm run build
      - name: Check the build
        run: |
          test "$(dist/bin/visualize --version)" = "$VISUALIZE_VERSION"
          app="dist/Project Visualize.app"
          test "$("$app/Contents/MacOS/visualize" --version)" = "$VISUALIZE_VERSION"
          for example in examples/*.json; do
            "$app/Contents/MacOS/visualize" validate --file "$example" > /dev/null
          done
          codesign --verify --deep "$app"
          echo "Minimum macOS: $(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")" >> "$GITHUB_STEP_SUMMARY"
      - name: Package the app
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "dist/Project Visualize.app" \
            "release/project-visualize-$VISUALIZE_VERSION-macos-arm64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-arm64
          path: release/*
          if-no-files-found: error

  linux:
    needs: version
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      VISUALIZE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the packages
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/linux/Dockerfile
          target: release
          build-args: VISUALIZE_VERSION=${{ env.VISUALIZE_VERSION }}
          load: true
          tags: visualize-release:local
          cache-from: type=gha,scope=visualize-release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=visualize-release-${{ matrix.arch }}
      - name: Check the packages
        run: |
          docker run --name visualize-release --init --env VISUALIZE_VERSION \
            visualize-release:local sh -c \
            'test "$(dist/bin/visualize --version)" = "$VISUALIZE_VERSION" && xvfb-run -a npm run check:linux-package'
          docker cp visualize-release:/app/dist/packages release
          rm release/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: [version, macos, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Publish the release
        run: |
          cd release
          sha256sum -- * > SHA256SUMS
          cat > notes.md <<EOF
          Built from ${GITHUB_SHA}.

          - **macOS** (Apple silicon): unzip and move **Project Visualize** to Applications. The app is not notarized, so the first launch is blocked: open **System Settings → Privacy & Security** and choose **Open Anyway**, or run \`xattr -dr com.apple.quarantine "/Applications/Project Visualize.app"\`.
          - **Linux** (x64, arm64): install the \`.deb\` with \`sudo apt install ./<file>.deb\`, or extract the tarball and run \`bin/visualize\`.

          Verify downloads against \`SHA256SUMS\`.
          EOF
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease --target "$GITHUB_SHA")
          else
            flags+=(--verify-tag)
          fi
          gh release create "$VERSION" "${flags[@]}" \
            --title "Project Visualize $VERSION" --notes-file notes.md \
            -- *.zip *.tar.gz *.deb SHA256SUMS
